services:
  # 1. MONGODB DATABASE
  mongo_db:
    image: mongo:latest
    container_name: radhika_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 2. NODE.JS BACKEND
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: radhika_backend
    ports:
      - "5005:5000"
    environment:
      # Nama "mongo_db" ini otomatis dikenali oleh Docker DNS karena berada di network yang sama
      - MONGO_URI=mongodb://mongo_db:27017/radhika_pos_db
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongo_db
    restart: unless-stopped
    volumes:
      # Mount folder uploads agar gambar produk tidak hilang saat container mati
      - backend_uploads:/app/uploads

  # 3. REACT/VITE FRONTEND (Dilayani oleh NGINX)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radhika_frontend
    ports:
      - "80:80"   # Akses dari browser di http://localhost
      - "5173:80" # Akses alternatif jika Anda terbiasa mengetik localhost:5173
    depends_on:
      - backend
    restart: unless-stopped

# Definisikan volume persisten agar data tidak terhapus saat container dimatikan
volumes:
  mongo_data:
  backend_uploads:
